
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: curecode-backend:latest
    container_name: bug-tracking-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      JWT_SECRET: ${JWT_SECRET:-change-me}

      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-bugtracker}:${MONGO_ROOT_PASSWORD:-bugtracker}@mongo:27017/${MONGO_APP_DATABASE:-bugtracker}?authSource=admin

      REDIS_URL: redis://redis:6379

      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      ENABLE_ADMIN_DEFAULT_LOGIN: ${ENABLE_ADMIN_DEFAULT_LOGIN:-true}

      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-CureCode SaaS Owner}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}

      EMAIL_HOST: ${EMAIL_HOST:-smtp.hostinger.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_FROM: ${EMAIL_FROM:-Pirnav Support <no-reply@example.com>}

      APP_URL: ${APP_URL:-https://curecode.site}
      FRONTEND_URL: ${FRONTEND_URL:-https://curecode.site,https://www.curecode.site}

      CASHFREE_ENV: ${CASHFREE_ENV}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY}

      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      BEDROCK_REGION: ${BEDROCK_REGION:-ap-south-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-global.amazon.nova-2-lite-v1:0}

      TURN_USERNAME: ${TURN_USERNAME:-turnuser}
      TURN_PASSWORD: ${TURN_PASSWORD}

    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    volumes:
      - ./backend/uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5000/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: curecode-frontend:latest
    container_name: bug-tracking-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

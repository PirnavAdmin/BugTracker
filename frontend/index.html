<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="CureCode" />
    <meta name="apple-mobile-web-app-title" content="CureCode" />
    <meta name="description" content="CureCode - Where code gets cured." />
    <meta name="theme-color" content="#111113" />
    <meta name="msapplication-TileColor" content="#111113" />
    <link rel="icon" href="/icons/favicon.ico?v=20260727-3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=20260727-3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=20260727-3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=20260727-3" />
    <link rel="preload" as="image" href="/icons/icon-192x192.png?v=20260727-3" />
    <link rel="manifest" href="/site.webmanifest?v=20260727-3" />
    <title>CureCode | Where code gets cured.</title>
    <style>
      #root:empty {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 58% 44%, rgba(193, 38, 255, 0.2), transparent 28rem),
          #111113;
      }

      .app-loading {
        display: grid;
        justify-items: center;
        gap: 1rem;
        color: #f8fafc;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-loading__icon {
        width: 6rem;
        height: 6rem;
        border-radius: 1.5rem;
        box-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.35), 0 0 2rem rgba(193, 38, 255, 0.22);
        animation: app-loading-pulse 1.6s ease-in-out infinite;
      }

      .app-loading__label {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      @keyframes app-loading-pulse {
        0%,
        100% {
          opacity: 0.78;
          transform: scale(0.96);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" aria-label="CureCode is loading">
        <img class="app-loading__icon" src="/icons/icon-192x192.png?v=20260727-3" alt="" />
        <p class="app-loading__label">Loading CureCode</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
